name: Profiles

# The signing/publishing pipeline lives in the yuuuuukiu/yukitunnel-profiles
# repository (see scripts/init-profiles-repo.sh). This workflow only *validates*
# profile changes in the main repo, so a contributor without any signing key can
# still get a green check on their PR.
on:
  push:
    paths: ['profiles/**', 'internal/cloudprofile/**']
  pull_request:
    paths: ['profiles/**', 'internal/cloudprofile/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: Schema validation
        run: go test ./internal/cloudprofile/... -run 'TestOfficialProfiles|TestPortRange|TestProtocol' -v

      - name: Bundled copies are in sync
        run: |
          go test ./internal/cloudprofile -run TestBundledProfilesMatchRepository -v
          if [ $? -ne 0 ]; then
            echo "::error::internal/cloudprofile/bundled/ is out of date."
            echo "Run: cp profiles/*.yaml internal/cloudprofile/bundled/"
            exit 1
          fi

      - name: Engine and signing tests
        run: go test ./internal/cloudprofile/... -race -timeout 180s

      - name: Offline install smoke
        run: |
          go build -o bin/yuki-server ./cmd/yuki-server
          mkdir -p /tmp/yt
          ./bin/yuki-server init --data-dir /tmp/yt \
            --api-addr 127.0.0.1:18999 --control-addr 127.0.0.1:19999 \
            --admin-password test12345 --port-min 29000 --port-max 29010 >/dev/null
          YUKI_PROFILE_MIRRORS="http://127.0.0.1:1" \
            ./bin/yuki-server profile install aliyun-ecs-security-group --data-dir /tmp/yt
          ./bin/yuki-server profile list --data-dir /tmp/yt | grep -q aliyun-ecs-security-group

      - name: No signing material committed
        run: |
          # Match key files, not scripts that merely mention signing.
          if git ls-files | grep -qE '(profile-signing\.key|\.pem$|\.p12$)'; then
            echo "::error::signing material must never be committed"
            git ls-files | grep -E '(profile-signing\.key|\.pem$|\.p12$)'
            exit 1
          fi
          echo "no signing material tracked"
