name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '构建但不发布（跳过 GitHub Release 创建）'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump when the profile signing key rotates; must match
  # builtinProfileKeyID in internal/server/profilekeys.go.
  PROFILE_KEY_ID: yuki-profiles-2026

jobs:
  # ── Gate: refuse to release a build that still ships the dev signing key ──
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse placeholder profile signing key
        run: |
          if grep -q 'const builtinProfileKeyB64 = placeholderProfileKey' internal/server/profilekeys.go; then
            echo "::error::builtinProfileKeyB64 is still the development placeholder."
            echo "Run scripts/gen-profile-signing-key.sh, then replace the constant:"
            echo '  const builtinProfileKeyB64 = "<base64 public key>"'
            echo "A release built with the placeholder cannot verify the profile registry,"
            echo "so every cloud profile download would fail at runtime."
            exit 1
          fi
          echo "profile signing key is pinned"

      - name: Verify the pinned key parses
        run: |
          go run ./cmd/yuki-profile-sign -h >/dev/null
          YUKI_RELEASE=1 go test ./internal/server -run TestBuiltinKeyIsNotPlaceholder -v

  # ── Go quality gate ───────────────────────────────────────────────────────
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -timeout 300s

      - name: End-to-end smoke
        run: bash scripts/smoke.sh

      - name: End-to-end (no docker)
        run: bash scripts/e2e-local.sh --no-docker

  # ── Profiles: validate only ───────────────────────────────────────────────
  # Signing and publishing happen in yuuuuukiu/yukitunnel-profiles, because a
  # profile fix must not require a YukiTunnel release. This job only proves the
  # profiles shipped inside this binary are valid and in sync.
  profiles:
    name: Validate bundled profiles
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: Schema and signature tests
        run: |
          go test ./internal/cloudprofile/... -race -timeout 180s

      - name: Bundled copies match profiles/
        run: |
          go test ./internal/cloudprofile -run TestBundledProfilesMatchRepository -v

      - name: No signing material tracked
        run: |
          # Match key files, not scripts that merely mention signing.
          if git ls-files | grep -qE '(\.pem$|\.key$|\.p12$|(^|/)profile-signing\.)'; then
            echo "::error::signing material must never be committed"
            git ls-files | grep -E '(\.pem$|\.key$|\.p12$|(^|/)profile-signing\.)'
            exit 1
          fi
          echo "no signing material tracked"

  # ── Binaries ──────────────────────────────────────────────────────────────
  binaries:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [preflight, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: 386 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build WebUI
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      - name: Embed WebUI
        run: |
          rm -rf internal/server/webdist && mkdir -p internal/server/webdist
          cp -R web/dist/. internal/server/webdist/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          LDFLAGS="-s -w -X github.com/yuuuuukiu/yukitunnel/internal/version.Version=${VERSION}"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/yuki-server-${GOOS}-${GOARCH}${ext}" ./cmd/yuki-server
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/yuki-${GOOS}-${GOARCH}${ext}" ./cmd/yuki
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/yuki-live-test-${GOOS}-${GOARCH}${ext}" ./cmd/yuki-live-test
          ( cd dist && shasum -a 256 * > "SHA256SUMS-${GOOS}-${GOARCH}.txt" )

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # ── Container image ───────────────────────────────────────────────────────
  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [preflight, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
          tags: |
            ghcr.io/yuuuuukiu/yuki-server:${{ needs.preflight.outputs.version }}
            ghcr.io/yuuuuukiu/yuki-server:latest

  # ── Desktop bundles ───────────────────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [preflight, test]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build sidecars
        shell: bash
        run: bash scripts/prepare-sidecars.sh

      # desktop/ compiles ../web/src via the @web alias; TypeScript resolves
      # modules from the importing file, so web/node_modules must exist.
      - name: Install web deps
        run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      - uses: tauri-apps/tauri-action@v0
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: YukiTunnel ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true

  # ── Publish ───────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [preflight, binaries, profiles]
    if: ${{ github.event_name == 'push' && !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ( cd release && shasum -a 256 * > SHA256SUMS.txt )
          ls -lh release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: YukiTunnel v${{ needs.preflight.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          body_path: docs/RELEASE-NOTES-v0.1.0.md
          files: release/*
