# 阿里云 ECS 安全组 —— 官方维护 profile
#
# 依据：阿里云 ECS OpenAPI AuthorizeSecurityGroup / RevokeSecurityGroup /
#       DescribeSecurityGroups（API Version 2014-05-26，RPC 风格）。
# 关键差异：端口用斜杠 "起始/结束"；签名 HMAC-SHA1；规则优先级 Priority 越小越高。
apiVersion: yukitunnel.io/v1
kind: CloudProfile
metadata:
  id: aliyun-ecs-security-group
  name: 阿里云 ECS 安全组
  vendor: aliyun
  version: 1.0.0
  maintainer: yukitunnel
  min_engine: 0.2.0
  description: |
    在指定安全组中放行/回收入方向端口。使用 AuthorizeSecurityGroup 添加规则，
    执行前通过 DescribeSecurityGroups 做幂等检查，重复执行不会产生重复规则。
  docs:
    - https://help.aliyun.com/zh/ecs/developer-reference/api-ecs-2014-05-26-authorizesecuritygroup
    - https://help.aliyun.com/zh/ecs/developer-reference/api-ecs-2014-05-26-revokesecuritygroup

spec:
  auth:
    engine: aliyun-hmac-sha1
    credential_fields: [access_key_id, access_key_secret]
    version: "2014-05-26"

  endpoint:
    template: "https://ecs.{{ .region }}.aliyuncs.com/"
    method: POST
    content_type: application/x-www-form-urlencoded
    query:
      Version: "2014-05-26"

  # 只允许访问阿里云 ECS 端点，防止凭证被恶意 profile 外发
  allowed_hosts:
    - "ecs.*.aliyuncs.com"

  # 最小权限：UI 会把这三项展示给管理员确认
  permissions:
    - "ecs:DescribeSecurityGroups"
    - "ecs:AuthorizeSecurityGroup"
    - "ecs:RevokeSecurityGroup"

  parameters:
    - name: region
      label: 地域
      required: true
      example: cn-hangzhou
      description: 安全组所在地域，例如 cn-hangzhou / ap-southeast-1
    - name: security_group_id
      label: 安全组 ID
      required: true
      example: sg-bp1xxxxxxxxxxxx
    - name: source_cidr
      label: 允许的来源网段
      default: "0.0.0.0/0"
      description: 建议收敛到固定 IP，例如 203.0.113.7/32
    - name: port_min
      label: 起始端口
      required: true
      example: "20000"
    - name: port_max
      label: 结束端口
      required: true
      example: "20100"
    - name: protocol
      label: 协议
      default: tcp
      enum: [tcp, udp]
    - name: description
      label: 规则描述
      default: "YukiTunnel managed rule"
    - name: priority
      label: 优先级
      default: "1"
      description: 1-100，数值越小优先级越高

  revoke_policy:
    by: same_params

  rate_limit_per_minute: 60

  actions:
    ensure_port_allowed:
      operation: AuthorizeSecurityGroup
      params:
        SecurityGroupId: "{{ .security_group_id }}"
        RegionId: "{{ .region }}"
        IpProtocol: '{{ proto "lower" .protocol }}'
        # 阿里云特有：端口必须写成 "起始/结束"
        PortRange: '{{ port_range "slash" .port_min .port_max }}'
        SourceCidrIp: "{{ .source_cidr }}"
        Policy: accept
        Priority: "{{ .priority }}"
        Description: "{{ .description }}"
        NicType: intranet
      idempotent_check:
        operation: DescribeSecurityGroups
        params:
          RegionId: "{{ .region }}"
          SecurityGroupId: "{{ .security_group_id }}"
        match:
          path: "SecurityGroups.SecurityGroup.0.Permissions.Permission"
          compare: port_range
          fields:
            IpProtocol: '{{ proto "lower" .protocol }}'
            PortRange: '{{ port_range "slash" .port_min .port_max }}'
            SourceCidrIp: "{{ .source_cidr }}"
            Policy: accept
      success_when:
        status: 200

    revoke_port_allowed:
      operation: RevokeSecurityGroup
      params:
        SecurityGroupId: "{{ .security_group_id }}"
        RegionId: "{{ .region }}"
        IpProtocol: '{{ proto "lower" .protocol }}'
        PortRange: '{{ port_range "slash" .port_min .port_max }}'
        SourceCidrIp: "{{ .source_cidr }}"
        Policy: accept
        NicType: intranet
      success_when:
        status: 200
        duplicate_codes: ["InvalidSecurityGroupRule.NotFound"]
